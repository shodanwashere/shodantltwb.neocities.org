---
layout: default
ytembedid: AFvLNB2oFNk
song: Miiverse Main Theme
artist: Nintendo
---
<div class="window active glass">
  <div class="title-bar">
    <div class="title-bar-text">Blog</div>
    <div class="title-bar-controls">
      <button aria-label="Minimize"></button>
      <button aria-label="Maximize"></button>
      <button aria-label="Close"></button>
    </div>
  </div>
  <div class="window-body has-space" style="overflow: hidden">
    <table>
      <colgroup>
        <col span="1" style="width: 15%">
        <col span="1" style="width: 35%">
        <col span="1" style="width: 50%">
      </colgroup>
      <thead>
        <th>Date</th>
        <th>Title</th>
        <th>Categories</th>
      </thead>
      <tbody>
        {% for post in site.posts %}
        <tr>
          <td>{{ post.date | date: '%m/%d/%Y' }}</td>
          <td><a href="{{ post.url }}">{{ post.title }}</a></td>
          <td>
            {% for tag in post.tags %}
              <button>{{ tag }}</button>
            {% endfor %}
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
